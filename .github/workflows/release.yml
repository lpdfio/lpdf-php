name: Release
run-name: "Release ${{ github.event.client_payload.version || github.ref_name }} to Packagist (${{ github.event_name == 'repository_dispatch' && 'core' || 'adapter' }})"

on:
  repository_dispatch:
    types: [core-release]
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-24.04
    # A run dispatched by core's release was approved there, on core's `release`. A package patch is
    # a tag pushed here, and waits for this repo's own `release` approval.
    environment: ${{ github.event_name == 'repository_dispatch' && 'release-core' || 'release' }}
    permissions:
      actions: read      # lists this repo's rc.yml runs, for the check after "Resolve version"
      contents: write
    steps:
      - uses: actions/checkout@v5

      # ── Resolve version ──────────────────────────────────────────────────────
      - name: Resolve version
        run: |
          ADAPTER_TAG="${{ github.event.client_payload.version || github.ref_name }}"
          CORE_TAG=$(echo "$ADAPTER_TAG" | sed 's/\.[0-9]*$/.0/')
          VERSION="${ADAPTER_TAG#v}"
          echo "ADAPTER_TAG=$ADAPTER_TAG"   >> "$GITHUB_ENV"
          echo "CORE_TAG=$CORE_TAG"         >> "$GITHUB_ENV"
          echo "VERSION=$VERSION"           >> "$GITHUB_ENV"

      # ── Require main to be what the release candidate tested ─────────────────
      # A core release is approved once, on core's `release`, so this run waits for nobody. This
      # check stands where the other clicks did. This repo's rc.yml built and tested `main` as it was
      # when the RC was dispatched, and this run builds `main` as it is now: the two must be the same
      # commit, apart from the bots' changelog and release commits, or what ships was never tested
      # by an RC. Another RC on the same core commit tests the newer `main`; then send this repo
      # `core-release` again, since a re-run builds the commit of the first run.
      # A package patch is released by pushing its tag. It has no RC, and keeps its approval.
      - name: Require main to be what the release candidate tested
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$ADAPTER_TAG" != "$CORE_TAG" ]; then
            echo "::error::A core release dispatches vX.Y.0, and this dispatch carries $ADAPTER_TAG. A package patch is released by pushing its tag."
            exit 1
          fi

          # The newest RC of this version on the commit being released that has a green run here.
          RELEASE_SHA=$(gh api "repos/lpdfio/lpdf/commits/$CORE_TAG" --jq .sha)
          RC_TAG=""
          for RC in $(gh api "repos/lpdfio/lpdf/git/matching-refs/tags/${CORE_TAG}-rc." --jq '.[].ref | ltrimstr("refs/tags/")' | sort -V -r); do
            [ "$(gh api "repos/lpdfio/lpdf/commits/$RC" --jq .sha)" = "$RELEASE_SHA" ] || continue
            RC_SHA=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow rc.yml --event repository_dispatch --status success --limit 100 \
              --json displayTitle,headSha | jq -r --arg title "RC $RC:" 'map(select(.displayTitle | startswith($title))) | .[0].headSha // empty')
            if [ -n "$RC_SHA" ]; then RC_TAG=$RC; break; fi
          done
          if [ -z "$RC_TAG" ]; then
            echo "::error::No green rc.yml run here for a release candidate of $CORE_TAG on its commit ${RELEASE_SHA:0:7}. Cut one, and check its runs, before releasing."
            exit 1
          fi

          COMPARE=$(gh api "repos/$GITHUB_REPOSITORY/compare/$RC_SHA...$GITHUB_SHA")
          STATUS=$(jq -r .status <<<"$COMPARE")
          NEWER=$(jq -r '.commits[] | select(.commit.message | test("^(changelog|release): ") | not) | "  \(.sha[0:7]) \(.commit.message | split("\n")[0])"' <<<"$COMPARE")
          if { [ "$STATUS" != identical ] && [ "$STATUS" != ahead ]; } || [ -n "$NEWER" ]; then
            echo "::error::main has moved since $RC_TAG was tested: rc.yml ran on ${RC_SHA:0:7} and this run builds ${GITHUB_SHA:0:7} ($STATUS). Cut another RC on ${RELEASE_SHA:0:7}, then send this repo core-release again."
            [ -z "$NEWER" ] || printf 'Commits since %s:\n%s\n' "${RC_SHA:0:7}" "$NEWER"
            exit 1
          fi
          echo "main is ${GITHUB_SHA:0:7}, the commit $RC_TAG tested here (${RC_SHA:0:7})."

      # ── Download WASI binary from core release ───────────────────────────────
      # PHP adapter expects resources/lpdf-wasi.wasm
      - name: Download lpdf-wasi.wasm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p resources
          DOWNLOADED=""
          for attempt in 1 2 3; do
            gh release download "$CORE_TAG" \
              --repo lpdfio/lpdf \
              --pattern "lpdf-wasi.wasm" \
              --dir resources \
              --clobber && DOWNLOADED=1 && break
            echo "Attempt $attempt failed — retrying in 10s..."
            sleep 10
          done
          # No fallback to the latest core: vX.Y.Z must ship engine vX.Y.0
          # (var/VERSIONING.md in lpdfio/lpdf). ci.yml keeps its fallback.
          # The flag matters here: resources/lpdf-wasi.wasm is tracked in git,
          # so the file exists even when this download failed.
          if [ -z "$DOWNLOADED" ]; then
            echo "::error::Could not download core $CORE_TAG. This release must ship engine $CORE_TAG — publish that core release first, or check the tag."
            exit 1
          fi

      # ── Install wasmtime runtime ─────────────────────────────────────────────
      # Pinned, straight from the release archive — see ci.yml for why
      # wasmtime.dev/install.sh cannot be trusted to fail loudly. That was the
      # "WASI process produced no output" bug: the runtime was never installed.
      - name: Install wasmtime
        env:
          WASMTIME_VERSION: v48.0.2
        run: |
          ARCHIVE="wasmtime-${WASMTIME_VERSION}-$(uname -m)-linux"
          curl -sSfL --retry 3 \
            "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${ARCHIVE}.tar.xz" \
            -o wasmtime.tar.xz
          mkdir -p "$HOME/.wasmtime/bin"
          tar -xJf wasmtime.tar.xz -C "$HOME/.wasmtime/bin" --strip-components=1 "${ARCHIVE}/wasmtime"
          rm wasmtime.tar.xz
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Verify wasmtime on PATH
        run: |
          which wasmtime
          wasmtime --version

      # ── Install PHP and dependencies ─────────────────────────────────────────
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist

      # ── Fetch test fixtures and snapshots from core ──────────────────────────
      # The fixture XML files and golden SHA-256 snapshots live in the core
      # monorepo (lpdfio/lpdf).  Sparse-clone only those two directories so
      # that snapshot tests can actually run in this adapter's CI.
      # Cloned at CORE_TAG, the engine this release ships, so the snapshots
      # match it even after core's main has moved on (e.g. between an RC and
      # the final release).
      - name: Fetch test fixtures and snapshots from core
        run: |
          git clone --depth 1 --branch "$CORE_TAG" --filter=blob:none --sparse \
            https://github.com/lpdfio/lpdf.git _core
          git -C _core sparse-checkout set test/fixtures test/snapshots
          mkdir -p test/fixtures test/snapshots
          cp -r _core/test/fixtures/. test/fixtures/
          cp -r _core/test/snapshots/. test/snapshots/
          rm -rf _core

      # ── Test ─────────────────────────────────────────────────────────────────
      - name: Test
        run: php vendor/bin/phpunit test

      # ── Commit new wasm, tag, and push ───────────────────────────────────────
      # Every push uses this run's GITHUB_TOKEN, which actions/checkout leaves
      # in the git config. That also keeps the tag push below from starting
      # this workflow again: GitHub starts no workflow for a GITHUB_TOKEN push.
      - name: Set git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Log release version
        run: |
          # composer.json does not carry a version field (Packagist reads the tag).
          # Nothing to update; the tag itself is the version signal.
          echo "Version: $VERSION (tag: $ADAPTER_TAG)"

      # ── Changelog ────────────────────────────────────────────────────────────
      # php deliberately differs from the other three adapters: it does NOT
      # switch to main first. resources/lpdf-wasi.wasm is tracked and already
      # modified in the working tree by this point, so a branch switch would be
      # refused. Instead the file is written here and carried by the existing
      # commit/push steps below, which already push HEAD:main.
      #
      # Fails the job on error, deliberately — see changelog-plan.md, "Rollout".
      - name: Prepare CHANGELOG entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            # Core cascade. Nobody types notes on this path — nobody can — so
            # copy core's verbatim. Core publishes its release before
            # dispatching, so the body is always readable by now.
            BODY=$(gh release view "$CORE_TAG" --repo lpdfio/lpdf --json body -q .body | tr -d '\r')
            HEADER="## $ADAPTER_TAG (core) — $(date -u +%F)"
          else
            # Adapter-only patch: the notes typed on this repo's own release.
            BODY=$(gh release view "$ADAPTER_TAG" --json body        -q .body        | tr -d '\r')
            DATE=$(gh release view "$ADAPTER_TAG" --json publishedAt -q .publishedAt | cut -c1-10)
            if [ -z "$DATE" ]; then
              echo "::error::$ADAPTER_TAG has no published release — was the tag pushed without one?"
              exit 1
            fi
            HEADER="## $ADAPTER_TAG — $DATE"
          fi

          # Hand the body to the release step below (multi-line safe).
          {
            echo 'RELEASE_BODY<<__LPDF_BODY__'
            printf '%s\n' "$BODY"
            echo '__LPDF_BODY__'
          } >> "$GITHUB_ENV"

          if ! head -n 1 CHANGELOG.md | grep -qx '# Changelog'; then
            echo "::error::CHANGELOG.md must start with a '# Changelog' line"
            exit 1
          fi

          # Re-runs must not duplicate an entry.
          if grep -q "^## $ADAPTER_TAG " CHANGELOG.md; then
            echo "$ADAPTER_TAG is already in CHANGELOG.md — nothing to do"
            exit 0
          fi

          # Prepend only. Never reformat or reorder what is already there —
          # the file is hand-editable by design.
          {
            echo "# Changelog"
            echo
            echo "$HEADER"
            if [ -n "$BODY" ]; then printf '%s\n' "$BODY"; fi
            tail -n +2 CHANGELOG.md
          } > CHANGELOG.next
          mv CHANGELOG.next CHANGELOG.md

      - name: Commit updated wasm binary and changelog
        run: |
          git add -f resources/lpdf-wasi.wasm
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "release: $ADAPTER_TAG"

      # main's ruleset takes changes through a PR only, and the lpdf release App
      # is its one bypass actor. So the release commit below is pushed to main
      # with a token of that App, minted here for this repo. The App's key is a
      # secret of this job's environments, never of the repo. `release` waits for
      # the user's approval. `release-core` has no reviewer, so it is limited to
      # main: only a workflow merged there can read the key.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.LPDF_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.LPDF_RELEASE_APP_PRIVATE_KEY }}

      # main can move while this job runs: v0.17.0 never shipped from here
      # because a commit landed on main mid-release and this push was rejected.
      # So a rejected push fetches main, merges the release commit into it and
      # tries again. Merge, not rebase: Packagist ships the tagged tree itself,
      # so the tag stays on the release commit, the tree that was tested here,
      # and the newer commit on main waits for the next release. If the newer
      # commit also changed the wasm or the top of CHANGELOG.md, the job stops
      # with nothing pushed.
      #
      # On a direct tag trigger (adapter patch) the tag already exists; only
      # the release commit is pushed.
      #
      # The push to main goes as the App: the empty extraheader drops the
      # GITHUB_TOKEN header that checkout set, so git sends the App token from
      # the URL instead. The tag push stays on GITHUB_TOKEN; the ruleset covers
      # branches only.
      - name: Push to main, then tag
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          RELEASE_COMMIT=$(git rev-parse HEAD)
          PUSHED=""
          for attempt in 1 2 3; do
            git -c http.https://github.com/.extraheader= push \
              "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main && PUSHED=1 && break
            echo "main moved during the release (attempt $attempt): merging the release commit into it..."
            git fetch origin main
            git checkout -q --detach FETCH_HEAD
            if ! git merge --no-edit -m "release: merge $ADAPTER_TAG into main" "$RELEASE_COMMIT"; then
              git merge --abort
              echo "::error::A commit pushed to main during the release conflicts with the release commit (resources/lpdf-wasi.wasm or CHANGELOG.md). Nothing was pushed. Resolve it on main, then re-run this job."
              exit 1
            fi
          done
          if [ -z "$PUSHED" ]; then
            echo "::error::Could not push the release commit to main after 3 attempts. Nothing was pushed."
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            git tag "$ADAPTER_TAG" "$RELEASE_COMMIT"
            git push origin "$ADAPTER_TAG"
          fi

      # ── Notify Packagist ─────────────────────────────────────────────────────
      # Packagist does not pick up the tag on its own: v0.16.0, v0.18.0 and
      # v0.19.0 each waited for a manual "Update" on packagist.org, and without
      # a working hook it only crawls once a week. So ask it to re-read the
      # repo now. Right after the push, so a later failing step can't skip it.
      #
      # Warn-only: the tag is on GitHub by now, so the release has shipped. A
      # Packagist problem shows as a warning on the run and never fails the
      # job; the manual Update button still works. (The step removed on
      # 2026-09-16 failed the job on bad credentials.)
      #
      # PACKAGIST_USERNAME is a repository variable, PACKAGIST_API_TOKEN a
      # secret holding the SAFE token from https://packagist.org/profile/
      # (update-package accepts it, and it is the one meant for CI).
      - name: Notify Packagist
        env:
          PACKAGIST_USERNAME: ${{ vars.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          MANUAL="Press Update on https://packagist.org/packages/lpdfio/lpdf"
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_API_TOKEN" ]; then
            echo "::warning::Packagist not notified: set the PACKAGIST_USERNAME variable and the PACKAGIST_API_TOKEN secret. $MANUAL"
            exit 0
          fi
          RESPONSE="$RUNNER_TEMP/packagist.json"
          : > "$RESPONSE"   # curl writes nothing when it can't connect
          STATUS=$(curl -s -o "$RESPONSE" -w '%{http_code}' --max-time 30 -X POST \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $PACKAGIST_USERNAME:$PACKAGIST_API_TOKEN" \
            https://packagist.org/api/update-package \
            -d '{"repository":"https://github.com/lpdfio/lpdf-php"}' || true)
          case "$STATUS" in
            2??) echo "Packagist accepted the update ($STATUS): $(cat "$RESPONSE")" ;;
            *)   BODY=$(tr -d '\r\n' < "$RESPONSE" | head -c 300)
                 echo "::warning::Packagist not notified (HTTP $STATUS)${BODY:+: $BODY}. $MANUAL" ;;
          esac

      # ── Create GitHub Release (core-triggered only) ──────────────────────────
      # --notes carries core's text onto this repo's Releases page, which
      # otherwise shows a bare "Full Changelog" compare link. --generate-notes
      # remains the fallback for an empty core body.
      - name: Create GitHub Release
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${RELEASE_BODY:-}" ]; then
            gh release create "$ADAPTER_TAG" \
              --title "$ADAPTER_TAG" \
              --notes "$RELEASE_BODY"
          else
            gh release create "$ADAPTER_TAG" \
              --title "$ADAPTER_TAG" \
              --generate-notes
          fi
