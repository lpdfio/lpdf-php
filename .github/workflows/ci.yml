name: CI
run-name: "${{ format('CI (build + test): {0}', github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message) }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      # ── Download WASI binary from core release ───────────────────────────────
      # Derives the core tag from the latest semver git tag in this repo
      # (strip patch → .0).  Falls back to the latest core release when no
      # adapter tag exists yet.
      - name: Download lpdf-wasi.wasm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p resources
          ADAPTER_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | head -1)
          CORE_TAG=$(echo "${ADAPTER_TAG:-v0.0.0}" | sed 's/\.[0-9]*$/.0/')
          echo "Resolved adapter tag: ${ADAPTER_TAG:-<none>}"
          echo "Resolved core tag: $CORE_TAG"
          # No adapter tags yet — go straight to latest
          if [ -z "$ADAPTER_TAG" ] || [ "$CORE_TAG" = "v0.0.0" ]; then
            echo "No adapter tag — downloading latest release"
            gh release download \
              --repo lpdfio/lpdf \
              --pattern "lpdf-wasi.wasm" \
              --dir resources \
              --clobber
            CORE_TAG=$(gh release view --repo lpdfio/lpdf --json tagName --jq .tagName)
            echo "Resolved latest core tag: $CORE_TAG"
          else
            for attempt in 1 2 3; do
              gh release download "$CORE_TAG" \
                --repo lpdfio/lpdf \
                --pattern "lpdf-wasi.wasm" \
                --dir resources \
                --clobber && break
              echo "Attempt $attempt failed — retrying in 10s..."
              sleep 10
            done
            # Fallback to latest release when the derived tag doesn't exist yet
            if [ ! -f resources/lpdf-wasi.wasm ]; then
              gh release download \
                --repo lpdfio/lpdf \
                --pattern "lpdf-wasi.wasm" \
                --dir resources \
                --clobber
              CORE_TAG=$(gh release view --repo lpdfio/lpdf --json tagName --jq .tagName)
            fi
          fi
          echo "EFFECTIVE_CORE_TAG=$CORE_TAG" >> "$GITHUB_ENV"

      # ── Install wasmtime runtime ─────────────────────────────────────────────
      # Pinned, straight from the release archive. wasmtime.dev/install.sh
      # resolves "latest" through the unauthenticated GitHub API — rate-limited
      # from Actions runners — and its last statement swallows the failure, so
      # it exits 0 having installed nothing. The runtime then goes missing with
      # no message anywhere, and PHP reports it as "WASI process produced no
      # output" on every engine test.
      - name: Install wasmtime
        env:
          WASMTIME_VERSION: v48.0.2
        run: |
          ARCHIVE="wasmtime-${WASMTIME_VERSION}-$(uname -m)-linux"
          curl -sSfL --retry 3 \
            "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${ARCHIVE}.tar.xz" \
            -o wasmtime.tar.xz
          mkdir -p "$HOME/.wasmtime/bin"
          tar -xJf wasmtime.tar.xz -C "$HOME/.wasmtime/bin" --strip-components=1 "${ARCHIVE}/wasmtime"
          rm wasmtime.tar.xz
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      # $GITHUB_PATH only reaches later steps, so this is where a runtime the
      # tests cannot find shows up — here, and not as 41 test errors.
      - name: Verify wasmtime on PATH
        run: |
          which wasmtime
          wasmtime --version

      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist

      # ── Fetch test fixtures and snapshots from core ──────────────────────────
      - name: Fetch test fixtures and snapshots from core
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            --branch "$EFFECTIVE_CORE_TAG" \
            https://github.com/lpdfio/lpdf.git _core
          git -C _core sparse-checkout set test/fixtures test/snapshots
          mkdir -p test/fixtures test/snapshots
          cp -r _core/test/fixtures/. test/fixtures/
          cp -r _core/test/snapshots/. test/snapshots/
          rm -rf _core

      - name: Test
        run: php vendor/bin/phpunit test
