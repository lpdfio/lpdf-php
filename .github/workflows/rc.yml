name: Release candidate
run-name: "RC ${{ github.event.client_payload.version }}: build and test, no publish"

# Answers core's `core-rc` dispatch for a vX.Y.0-rc.N tag (Lpdf-devcycle.md
# §4.2 in lpdfio/lpdf). Tests this repo's main against the RC engine.
# Publishes nothing: no commit (the downloaded engine is never committed), no
# tag, no changelog, no GitHub Release, and no push. Packagist ships
# the git tree itself, so there is no package to keep. release.yml stays the
# only path to Packagist.

on:
  repository_dispatch:
    types: [core-rc]

permissions:
  contents: read

jobs:
  rc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history and tags, for "Unreleased commits"

      # ── Resolve version ──────────────────────────────────────────────────────
      # The payload is the core RC tag itself. Unlike release.yml, nothing is
      # derived from it: stripping the last number of v0.17.0-rc.1 would give
      # v0.17.0-rc.0.
      - name: Resolve version
        env:
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
        run: |
          if ! echo "$PAYLOAD_VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.0-rc\.[0-9]+$'; then
            echo "::error::Expected a core release-candidate tag like v0.17.0-rc.1, got '$PAYLOAD_VERSION'"
            exit 1
          fi
          echo "CORE_TAG=$PAYLOAD_VERSION"          >> "$GITHUB_ENV"
          echo "FINAL_TAG=${PAYLOAD_VERSION%-rc.*}" >> "$GITHUB_ENV"

      # ── Download the engine from the RC pre-release ──────────────────────────
      # No fallback: a test against any other engine proves nothing about this RC.
      # The flag matters here: the engine's files are tracked in git, so a file
      # exists even when its download failed. The WebAssembly the wasmtime runner
      # runs, and the native library for each CPU, which the FFI runner loads.
      - name: Download the engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p resources/lib
          for file in lpdf-wasi.wasm lib/liblpdf-linux-x86_64.so lib/liblpdf-linux-aarch64.so; do
            DOWNLOADED=""
            for attempt in 1 2 3; do
              gh release download "$CORE_TAG" \
                --repo lpdfio/lpdf \
                --pattern "$(basename "$file")" \
                --dir "resources/$(dirname "$file")" \
                --clobber && DOWNLOADED=1 && break
              echo "Attempt $attempt failed — retrying in 10s..."
              sleep 10
            done
            if [ -z "$DOWNLOADED" ]; then
              echo "::error::Could not download $(basename "$file") from core RC $CORE_TAG."
              exit 1
            fi
          done

      # ── Install wasmtime runtime ─────────────────────────────────────────────
      # Pinned, straight from the release archive — see ci.yml for why
      # wasmtime.dev/install.sh cannot be trusted to fail loudly.
      - name: Install wasmtime
        env:
          WASMTIME_VERSION: v48.0.2
        run: |
          ARCHIVE="wasmtime-${WASMTIME_VERSION}-$(uname -m)-linux"
          curl -sSfL --retry 3 \
            "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${ARCHIVE}.tar.xz" \
            -o wasmtime.tar.xz
          mkdir -p "$HOME/.wasmtime/bin"
          tar -xJf wasmtime.tar.xz -C "$HOME/.wasmtime/bin" --strip-components=1 "${ARCHIVE}/wasmtime"
          rm wasmtime.tar.xz
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Verify wasmtime on PATH
        run: |
          which wasmtime
          wasmtime --version

      # ── Install PHP and dependencies ─────────────────────────────────────────
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          extensions: ffi

      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist

      # The check below is a Node script.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # ── Check the API against the schema ─────────────────────────────────────
      # The attribute classes and constants follow from schema/lpdf.xsd, and the scripts that check
      # them live in core. Fails if a generated file differs from what the schema gives, or a class
      # has other attributes than the schema's element.
      # The schema is the one at the RC tag, which this engine ships with.
      - name: Check the API against the schema
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            --branch "$CORE_TAG" \
            https://github.com/lpdfio/lpdf.git _schema
          git -C _schema sparse-checkout set schema scripts
          node _schema/scripts/gen-sdk-api.mjs --check --sdk php=.
          node _schema/scripts/check-sdk-parity.mjs --sdk php=.
          rm -rf _schema

      # ── Fetch test fixtures, snapshots and assets from core ──────────────────
      # At the RC tag, so the golden snapshots match the engine under test. The
      # assets are the fonts, images and profile that core's snapshot tests load.
      - name: Fetch test fixtures, snapshots and assets from core
        run: |
          git clone --depth 1 --branch "$CORE_TAG" --filter=blob:none --sparse \
            https://github.com/lpdfio/lpdf.git _core
          git -C _core sparse-checkout set test/fixtures test/snapshots test/assets
          mkdir -p test/fixtures test/snapshots test/assets
          cp -r _core/test/fixtures/. test/fixtures/
          cp -r _core/test/snapshots/. test/snapshots/
          cp -r _core/test/assets/. test/assets/
          rm -rf _core

      # ── Test ─────────────────────────────────────────────────────────────────
      # Through both runners: first with the native library, which `auto` picks,
      # then with ffi.enable refused, where it falls back to wasmtime. ci.yml
      # covers aarch64, the Ubuntu and Debian releases and the other fallbacks.
      - name: Test, with the native library
        env:
          LPDF_TEST_RUNNERS: ffi,wasm
          LPDF_TEST_AUTO: ffi
        run: php vendor/bin/phpunit test

      - name: Test, with ffi.enable refused
        env:
          LPDF_TEST_RUNNERS: wasm
          LPDF_TEST_AUTO: wasm
          LPDF_TEST_FFI_REFUSED: 'restricted by "ffi.enable"'
        run: php -d ffi.enable=false vendor/bin/phpunit test

      # ── Check the code the code generator writes ─────────────────────────────
      # For every fixture of core, and a document for every attribute of the schema, the code the generator writes for
      # PHP is built with this SDK and has to render the PDF of the XML (scripts/check-codegen-sdk.mjs in core). The
      # generator is in the engine files of the RC tag (lpdf.js and lpdf_bg.wasm), which the WASI binary is not.
      - name: Check the code the code generator writes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DOWNLOADED=""
          for attempt in 1 2 3; do
            gh release download "$CORE_TAG" \
              --repo lpdfio/lpdf \
              --pattern "lpdf.js" \
              --pattern "lpdf_bg.wasm" \
              --dir _engine \
              --clobber && DOWNLOADED=1 && break
            echo "Attempt $attempt failed — retrying in 10s..."
            sleep 10
          done
          if [ -z "$DOWNLOADED" ]; then
            echo "::error::Could not download the code generator from core $CORE_TAG."
            exit 1
          fi
          git clone --depth 1 --filter=blob:none --sparse \
            --branch "$CORE_TAG" \
            https://github.com/lpdfio/lpdf.git _check
          git -C _check sparse-checkout set scripts test
          node _check/scripts/check-codegen-sdk.mjs --sdk php=. --engine _engine
          rm -rf _check _engine

      # ── What ships from this repo ────────────────────────────────────────────
      # The final core release publishes this repo's main as it stands. Anything
      # on main since the last release tag ships in FINAL_TAG with only core's
      # release notes (Lpdf-devcycle.md §4.1). Runs even if the tests failed.
      # Skips the bot's own "release: …" commits.
      - name: Unreleased commits
        if: always()
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          COMMITS=""
          if [ -n "$LAST" ]; then
            COMMITS=$(git log --oneline --no-merges --invert-grep \
              --grep='^changelog: ' --grep='^release: ' "$LAST..HEAD")
          fi
          {
            echo "### $REPO: release candidate $CORE_TAG"
            echo
            if [ -z "$LAST" ]; then
              echo "No release tag in this repo yet."
            elif [ -z "$COMMITS" ]; then
              echo "Nothing unreleased since $LAST. $FINAL_TAG changes only the engine."
            else
              echo "Unreleased since $LAST. These ship in $FINAL_TAG, with only core's release notes:"
              echo
              echo '```'
              echo "$COMMITS"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$COMMITS" ]; then
            echo "::notice::$(echo "$COMMITS" | wc -l | tr -d ' ') unreleased commit(s) since $LAST will ship in $FINAL_TAG"
          fi
